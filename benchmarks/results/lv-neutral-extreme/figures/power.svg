   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #5e6d80" transform="translate(74.52 412.6765)">Demand includes negative specified-node injections and actual voltage-dependent ZIP load consumption.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #5e6d80" transform="translate(74.52 424.06625)">Only original SLACK/PV or specified-injection conductors count as nodal sources; zero-injection residuals remain in the closure gap.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #5e6d80" transform="translate(74.52 435.456)">Element absorption includes lines, transformers and shunts; reactive absorption may be negative due to charging.</text>
  </g>
